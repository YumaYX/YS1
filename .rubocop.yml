AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Security/MarshalLoad:
  Exclude:
    - lib/ys1/report.rb

# Prefer a single readable method over splitting purely to hit metrics.
Metrics/AbcSize:
  Max: 25

# RuboCop counts every map/each block, so table rendering naturally scores
# high; table.rb is exempt and the limits stay tight for new code.
Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - lib/ys1/table.rb

Metrics/MethodLength:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 12
  Exclude:
    - lib/ys1/table.rb

